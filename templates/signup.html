<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Speak Confident</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at top left, #ede9fe, #e0e7ff, #f8fafc);
    }

    /* ✅ Background bubbles */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.5;
      z-index: 0;
      animation: float 6s ease-in-out infinite;
    }

    .bubble1 {
      width: 320px;
      height: 320px;
      background: #8b5cf6;
      top: -90px;
      left: -80px;
    }

    .bubble2 {
      width: 280px;
      height: 280px;
      background: #3b82f6;
      bottom: -85px;
      right: -60px;
      animation-delay: 1.5s;
    }

    .bubble3 {
      width: 200px;
      height: 200px;
      background: #22c55e;
      top: 60%;
      left: 15%;
      animation-delay: 2.2s;
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    /* ✅ Bigger Card (same as login page) */
    .signup-wrapper {
      position: relative;
      width: 520px;
      max-width: 94%;
      border-radius: 26px;
      overflow: hidden;
      padding: 2px;
      background: linear-gradient(135deg, rgba(139,92,246,0.65), rgba(99,102,241,0.65));
      box-shadow: 0 25px 60px rgba(0,0,0,0.18);
      z-index: 1;
    }

    .signup-form {
      width: 100%;
      padding: 48px 44px;
      border-radius: 24px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeUp 0.7s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ✅ Brand */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .brand span {
      font-size: 1.55rem;
      font-weight: 800;
      color: #312e81;
      letter-spacing: 0.2px;
    }

    /* ✅ Heading + subtitle */
    h2 {
      font-weight: 900;
      margin-bottom: 8px;
      text-align: center;
      color: #111827;
      font-size: 1.55rem;
    }

    p {
      color: #374151;
      margin-bottom: 26px;
      text-align: center;
      font-size: 1rem;
      font-weight: 500;
    }

    .form-control {
      border-radius: 16px;
      padding: 13px 16px;
      border: 1px solid #d1d5db;
      background: rgba(255,255,255,0.98);
      font-size: 1rem;
      font-weight: 500;
      color: #111827;
      transition: all 0.2s ease;
    }

    .form-control::placeholder {
      color: #6b7280;
      font-weight: 500;
    }

    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
    }

    /* ✅ Password toggle */
    .password-box {
      position: relative;
    }

    /* ✅ NEW: give space for Show/Hide */
    .password-box input {
      padding-right: 70px;
    }

    /* ✅ UPDATED: Fix toggle button moving down */
    .toggle-pass {
      position: absolute;
      top: 22px; /* ✅ fixed position instead of 50% */
      right: 14px;
      transform: none; /* ✅ remove translateY */
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #4f46e5;
      user-select: none;
      z-index: 5;
    }

    /* ✅ Button (same style) */
    .btn-signup {
      background: linear-gradient(90deg, #8b5cf6, #6366f1);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      transition: transform 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 15px 30px rgba(99,102,241,0.22);
    }

    .btn-signup:hover {
      opacity: 0.96;
      transform: translateY(-2px);
    }

    /* ✅ Strength text */
    #strengthText {
      display: block;
      margin-top: 8px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* ✅ Footer links */
    .footer-links {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #374151;
      text-align: center;
      font-weight: 500;
    }

    .footer-links a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 800;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* ✅ Error box (same as login page) */
    .error-box {
      display: none;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.25);
      color: #b91c1c;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- ✅ Background -->
<div class="bg-bubble bubble1"></div>
<div class="bg-bubble bubble2"></div>
<div class="bg-bubble bubble3"></div>

<div class="signup-wrapper">
  <div class="signup-form">

    <div class="brand">
      <span>Speak Confident</span>
    </div>

    <h2>Create Account</h2>
    <p>Signup to start practicing & improving your confidence</p>

    <div class="error-box" id="errorBox">Error message</div>

    <form id="signupForm" action="/register_user" method="POST" onsubmit="return validateSignup()">

      <div class="mb-3">
        <input type="text" class="form-control" id="username" name="username"
               placeholder="Username" required minlength="3">
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" id="email" name="email"
               placeholder="Email" required>
      </div>

      <div class="mb-3 password-box">
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Password" required minlength="6">
        <span class="toggle-pass" id="togglePass1">Show</span>
        <small id="strengthText" class="text-muted"></small>
      </div>

      <div class="mb-3 password-box">
        <input type="password" class="form-control" id="confirmPassword"
               placeholder="Confirm Password" required>
        <span class="toggle-pass" id="togglePass2">Show</span>
      </div>

      <button type="submit" class="btn btn-signup w-100 mb-3" id="signupBtn">
        Create Account
      </button>

      <div class="footer-links">
        Already have an account? <a href="/login">Login</a>
      </div>

    </form>
  </div>
</div>

<script>
  /* 👁️ Toggle password text like login page */
  function togglePassword(fieldId, toggleId) {
    const field = document.getElementById(fieldId);
    const toggle = document.getElementById(toggleId);

    if (field.type === "password") {
      field.type = "text";
      toggle.textContent = "Hide";
    } else {
      field.type = "password";
      toggle.textContent = "Show";
    }
  }

  document.getElementById("togglePass1").addEventListener("click", () => {
    togglePassword("password", "togglePass1");
  });

  document.getElementById("togglePass2").addEventListener("click", () => {
    togglePassword("confirmPassword", "togglePass2");
  });

  /* ✅ Password strength like before */
  document.getElementById('password').addEventListener('input', function(){
    const s = document.getElementById('strengthText');
    const v = this.value;

    if(v.length < 6){
      s.textContent = 'Weak password';
      s.className = 'text-danger';
    } else if(v.length < 10){
      s.textContent = 'Moderate password';
      s.className = 'text-warning';
    } else {
      s.textContent = 'Strong password';
      s.className = 'text-success';
    }
  });

  function validateSignup(){
    const username=document.getElementById('username'),
          email=document.getElementById('email'),
          password=document.getElementById('password'),
          confirmPassword=document.getElementById('confirmPassword');

    const errorBox = document.getElementById("errorBox");
    errorBox.style.display = "none";

    username.classList.remove("is-invalid");
    email.classList.remove("is-invalid");
    password.classList.remove("is-invalid");
    confirmPassword.classList.remove("is-invalid");

    if(username.value.length < 3){
      username.classList.add("is-invalid");
      errorBox.textContent = "Username must be at least 3 characters.";
      errorBox.style.display = "block";
      return false;
    }

    if(!email.value.includes('@') || !email.value.includes('.')){
      email.classList.add("is-invalid");
      errorBox.textContent = "Enter a valid email address.";
      errorBox.style.display = "block";
      return false;
    }

    if(password.value.length < 6){
      password.classList.add("is-invalid");
      errorBox.textContent = "Password must be at least 6 characters.";
      errorBox.style.display = "block";
      return false;
    }

    if(password.value !== confirmPassword.value){
      confirmPassword.classList.add("is-invalid");
      errorBox.textContent = "Passwords do not match.";
      errorBox.style.display = "block";
      return false;
    }

    return true;
  }

  /* ✅ Fetch Signup with error box + loading like login page */
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validateSignup()) return;

    const signupBtn = document.getElementById("signupBtn");
    const errorBox = document.getElementById("errorBox");

    signupBtn.disabled = true;
    signupBtn.innerHTML = "Creating account...";
    errorBox.style.display = "none";

    const formData = new FormData(e.target);

    try {
      const res = await fetch('/register_user', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.status === 'success') {
        // ✅ UPDATED TOKEN KEY (NO deletion, only update)
        if (data.access_token) {
          localStorage.setItem("access_token", data.access_token);
          localStorage.setItem("username", (formData.get("username") || ""));
          window.location.href = '/home';
          return;
        }

        window.location.href = '/login';
      } else {
        errorBox.textContent = data.message || "Signup failed.";
        errorBox.style.display = "block";
      }
    } catch (err) {
      console.error(err);
      errorBox.textContent = "Network error. Try again.";
      errorBox.style.display = "block";
    } finally {
      signupBtn.disabled = false;
      signupBtn.innerHTML = "Create Account";
    }
  });
</script>

</body>
</html>
