<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Speak Confident</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at top left, #ede9fe, #e0e7ff, #f8fafc);
    }

    /* ✅ Background bubbles */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.5;
      z-index: 0;
      animation: float 6s ease-in-out infinite;
    }

    .bubble1 {
      width: 320px;
      height: 320px;
      background: #8b5cf6;
      top: -90px;
      left: -80px;
    }

    .bubble2 {
      width: 280px;
      height: 280px;
      background: #3b82f6;
      bottom: -85px;
      right: -60px;
      animation-delay: 1.5s;
    }

    .bubble3 {
      width: 200px;
      height: 200px;
      background: #22c55e;
      top: 60%;
      left: 15%;
      animation-delay: 2.2s;
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    /* ✅ Bigger Login card */
    .login-wrapper {
      position: relative;
      width: 520px;          /* ✅ increased width */
      max-width: 94%;
      border-radius: 26px;
      overflow: hidden;
      padding: 2px;
      background: linear-gradient(135deg, rgba(139,92,246,0.65), rgba(99,102,241,0.65));
      box-shadow: 0 25px 60px rgba(0,0,0,0.18);
      z-index: 1;
    }

    .login-form {
      width: 100%;
      padding: 48px 44px;    /* ✅ increased padding */
      border-radius: 24px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeUp 0.7s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ✅ Brand (only text) */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .brand span {
      font-size: 1.55rem;     /* ✅ bigger */
      font-weight: 800;
      color: #312e81;         /* ✅ darker */
      letter-spacing: 0.2px;
    }

    /* ✅ More visible heading */
    h2 {
      font-weight: 900;
      margin-bottom: 8px;
      text-align: center;
      color: #111827;
      font-size: 1.55rem;     /* ✅ bigger */
    }

    /* ✅ More visible subtitle */
    p {
      color: #374151;         /* ✅ darker */
      margin-bottom: 26px;
      text-align: center;
      font-size: 1rem;        /* ✅ bigger */
      font-weight: 500;
    }

    .form-control {
      border-radius: 16px;
      padding: 13px 16px;
      border: 1px solid #d1d5db;
      background: rgba(255,255,255,0.98);
      transition: all 0.2s ease;
      font-size: 1rem;
      font-weight: 500;
      color: #111827;
    }

    .form-control::placeholder {
      color: #6b7280;
      font-weight: 500;
    }

    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
    }

    .password-box {
      position: relative;
    }

    .toggle-pass {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #4f46e5;
      user-select: none;
    }

    .btn-login {
      background: linear-gradient(90deg, #8b5cf6, #6366f1);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      transition: transform 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 15px 30px rgba(99,102,241,0.22);
    }

    .btn-login:hover {
      opacity: 0.96;
      transform: translateY(-2px);
    }

    .footer-links {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #374151;
      text-align: center;
      font-weight: 500;
    }

    .footer-links a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 800;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* ✅ Error box */
    .error-box {
      display: none;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.25);
      color: #b91c1c;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- ✅ Background -->
<div class="bg-bubble bubble1"></div>
<div class="bg-bubble bubble2"></div>
<div class="bg-bubble bubble3"></div>

<!-- 🔐 Clean session only once -->
<script>
if (!sessionStorage.getItem("login_cleaned")) {
  localStorage.clear();
  sessionStorage.setItem("login_cleaned", "yes");
}
</script>

<!-- 🔁 Auto redirect if already logged in -->
<script>
(async function () {
  const token = localStorage.getItem("access_token");
  if (!token) return;

  const res = await fetch("/verify_token", {
    headers: { Authorization: "Bearer " + token }
  });

  if (res.ok) window.location.href = "/home";
  else localStorage.clear();
})();
</script>

<div class="login-wrapper">

  <div class="login-form">

    <div class="brand">
      <span>Speak Confident</span>
    </div>

    <!-- ✅ Emoji removed -->
    <h2>Welcome Back</h2>
    <p>Login to continue practicing & improving your confidence</p>

    <div class="error-box" id="errorBox">Invalid credentials</div>

    <form id="loginForm">
      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email" required>
      </div>

      <div class="mb-3 password-box">
        <input type="password" class="form-control" id="password" placeholder="Password" required>
        <span class="toggle-pass" id="togglePass">Show</span>
      </div>

      <button type="submit" class="btn btn-login w-100 mb-3" id="loginBtn">
        Login
      </button>

      <div class="footer-links">
        Don’t have an account? <a href="/signup">Sign Up</a>
      </div>
    </form>

  </div>
</div>

<script>
/* 👁️ Show/Hide password */
document.getElementById("togglePass").addEventListener("click", () => {
  const pass = document.getElementById("password");
  const toggle = document.getElementById("togglePass");

  if (pass.type === "password") {
    pass.type = "text";
    toggle.textContent = "Hide";
  } else {
    pass.type = "password";
    toggle.textContent = "Show";
  }
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  const errorBox = document.getElementById("errorBox");
  const loginBtn = document.getElementById("loginBtn");

  errorBox.style.display = "none";
  loginBtn.disabled = true;
  loginBtn.innerHTML = "Logging in...";

  try {
    const res = await fetch("/login_user", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok && data.access_token) {
      localStorage.setItem("access_token", data.access_token);
      localStorage.setItem("username", data.username);
      sessionStorage.removeItem("login_cleaned");
      window.location.href = "/home";
    } else {
      errorBox.textContent = data.message || "Invalid credentials";
      errorBox.style.display = "block";
    }
  } catch {
    errorBox.textContent = "Login failed. Try again.";
    errorBox.style.display = "block";
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerHTML = "Login";
  }
});

/* 🚫 Prevent back navigation */
window.history.pushState(null, "", window.location.href);
window.onpopstate = () => {
  window.history.pushState(null, "", window.location.href);
};
</script>

</body>
</html>
